<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperitivos y Tapas - DelicIA's</title>
    <link href="css/styles.css" rel="stylesheet" />
    <style>
        body { 
            background-color: #fce891; 
            font-family: 'Lato', sans-serif; 
            margin: 0;
        }
        nav {
            background-color: #ffc1075c;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container-recetas { padding: 40px 20px; text-align: center; }
        
        .grid-recetas { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        .plato {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .plato:hover { transform: translateY(-5px); }

        .plato img {
            width: 100%; height: 200px;
            object-fit: cover; border-radius: 15px; margin-bottom: 15px;
        }

        .plato h3 { text-decoration: none; margin-bottom: 15px; }

        .btn-aperitivo {
            background-color: #00bcd4; 
            color: white;
            border: 2px solid black;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- MODAL ESTILO FICHA TÉCNICA (IGUAL AL RESTO) --- */
        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center; align-items: center;
        }

        .modal-content {
            background-color: white; 
            border: 4px solid black; 
            border-radius: 30px; 
            width: 90%; max-width: 900px;
            padding: 30px; position: relative;
            max-height: 85vh; overflow-y: auto;
            text-align: left;
        }

        .close-btn {
            position: absolute; top: 10px; right: 20px;
            font-size: 40px; cursor: pointer;
        }

        .receta-header { display: flex; gap: 25px; margin-bottom: 25px; }
        .receta-header img { 
            width: 300px; height: 250px;
            border: 3px solid black; 
            border-radius: 15px; 
            object-fit: cover;
        }

        .receta-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 30px; border-top: 3px solid black; padding-top: 20px;
        }

        h3 { text-decoration: none; margin-top: 0; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a href="index.php">
            <img src="assets/img/Logo.png" alt="Volver al inicio" style="width: 75px;">
        </a>
    </nav>

    <div class="container-recetas">
        <h1>Aperitivos y Picoteo</h1>
        <p>Bocados irresistibles para abrir el apetito en cualquier ocasión.</p>
        
        <div class="grid-recetas" id="gridAperitivos"></div>
    </div>

    <div id="modalAperitivos" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <div class="receta-header">
                <img id="mImg" src="" alt="">
                <div>
                    <h2 id="mTitulo" style="margin-top:0;"></h2>
                    <p id="mTiempo" style="font-weight:bold;"></p>
                    <p id="mDesc"></p>
                </div>
            </div>
            <div class="receta-grid">
                <div><h3>INGREDIENTES:</h3><ul id="mIngredientes" style="line-height: 1.6;"></ul></div>
                <div><h3>PASOS:</h3><ol id="mPasos" style="line-height: 1.6;"></ol></div>
            </div>
        </div>
    </div>

    <script>
        const recetasAperitivos = [
            {
                titulo: "Patatas Bravas Crujientes",
                img: "assets/img/bravas.jpg",
                tiempo: "35 min",
                desc: "Clásico español con una salsa brava casera llena de carácter.",
                ingredientes: ["500g patatas", "1 cebolla", "1 cda pimentón picante", "200g tomate frito", "Aceite de oliva"],
                pasos: ["Trocear cebolla 5 seg/vel 5 y sofreír 5 min/120°C.", "Añadir pimentón y tomate. Cocinar 10 min/100°C.", "Triturar la salsa.", "Freír las patatas y servir con la salsa."]
            },
            {
                titulo: "Nachos con Guacamole Real",
                img: "assets/img/nachos.jpg",
                tiempo: "10 min",
                desc: "Guacamole cremoso hecho al momento con el toque justo de lima.",
                ingredientes: ["2 aguacates maduros", "1/2 cebolla morada", "Zumo de 1/2 lima", "Cilantro fresco", "Nachos de maíz"],
                pasos: ["Picar cebolla y cilantro 5 seg/vel 5.", "Añadir el aguacate, sal y zumo de lima.", "Mezclar 15 seg/vel 4.", "Servir con los nachos."]
            },
            {
                titulo: "Gambas al Ajillo Gourmet",
                img: "assets/img/images.webp",
                tiempo: "15 min",
                desc: "Gambas jugosas con un aceite aromatizado que invita a mojar pan.",
                ingredientes: ["300g gambas peladas", "4 dientes de ajo", "1 guindilla", "50g aceite de oliva"],
                pasos: ["Laminar ajos y sofreír 5 min/120°C/vel 1.", "Añadir las gambas y guindilla.", "Cocinar 3 min/120°C/giro inverso.", "Servir muy calientes."]
            },
            {
                titulo: "Trío de Hummus",
                img: "assets/img/trio.jpg",
                tiempo: "15 min",
                desc: "Tres variedades de hummus: clásico, remolacha y espinacas.",
                ingredientes: ["400g garbanzos cocidos", "2 cdas tahini", "Zumo de 1 limón", "Ajo y comino"],
                pasos: ["Triturar los garbanzos con el resto de ingredientes 1 min/vel 10.", "Dividir y añadir remolacha o espinacas para los colores.", "Servir con crudités."]
            },
            {
                titulo: "Bruschettas de Tomate y Pesto",
                img: "assets/img/descarga3.jpg",
                tiempo: "15 min",
                desc: "Pan tostado crujiente con tomate marinado y aroma de albahaca.",
                ingredientes: ["Rebanadas de pan", "2 tomates", "Albahaca fresca", "Aceite de oliva"],
                pasos: ["Picar tomates y albahaca 4 seg/vel 4.", "Tostar el pan.", "Montar el tomate sobre el pan con un chorrito de aceite."]
            },
            {
                titulo: "Croquetas de Setas y Trufa",
                img: "assets/img/croq setas.jpg",
                tiempo: "45 min",
                desc: "Bocados gourmet con un corazón extremadamente cremoso.",
                ingredientes: ["200g setas", "100g harina", "1L leche", "Aceite de trufa"],
                pasos: ["Trocear y sofreír las setas.", "Hacer la bechamel 8 min/100°C/vel 4.", "Dejar enfriar, formar las croquetas y freír."]
            }
        ];

        const grid = document.getElementById('gridAperitivos');
        recetasAperitivos.forEach((r, i) => {
            grid.innerHTML += `
                <div class="plato">
                    <img src="${r.img}" alt="${r.titulo}">
                    <h3>${r.titulo}</h3>
                    <button class="btn-aperitivo" onclick="abrirReceta(${i})">Ver Receta</button>
                </div>`;
        });

        function abrirReceta(index) {
            const data = recetasAperitivos[index];
            document.getElementById('mTitulo').innerText = data.titulo;
            document.getElementById('mImg').src = data.img;
            document.getElementById('mTiempo').innerText = "🕒 " + data.tiempo;
            document.getElementById('mDesc').innerText = data.desc;
            document.getElementById('mIngredientes').innerHTML = data.ingredientes.map(ing => `<li>${ing}</li>`).join('');
            document.getElementById('mPasos').innerHTML = data.pasos.map(p => `<li>${p}</li>`).join('');
            document.getElementById('modalAperitivos').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() { 
            document.getElementById('modalAperitivos').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
